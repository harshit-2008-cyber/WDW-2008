<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
</head>
<body>
  <h1 align="center">Student Registration Form</h1>
  <hr>

  <form>
    <b>Full Name:</b>
    <input type="text" name="fullName" placeholder="Enter your full name">
    <br><br>

    <b>Email:</b>
    <input type="email" name="email" placeholder="Enter valid email address">
    <br><br>

    <b>Password:</b>
    <input type="password" name="password" placeholder="Enter password">
    <br><br>

    <b>Gender:</b>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br><br>

    <b>Course:</b>
    <select name="course">
      <option value="">-- Select Course --</option>
      <option>B.Tech</option>
      <option>BCA</option>
      <option>MCA</option>
    </select>
    <br><br>

    <b>Contact No:</b>
    <input type="tel" name="contact" placeholder="Enter phone number">
    <br><br>

    <b>Address:</b>
    <br>
    <textarea name="address" rows="5" cols="40" placeholder="Enter your address"></textarea>
    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">
  </form>

  <hr>
  <p align="center">&copy; 2025 Student Registration Portal</p>
</body>
</html>
